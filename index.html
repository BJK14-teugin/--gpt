<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="범-GPT - AI 채팅 서비스">
<meta name="keywords" content="범-GPT, AI, GPT, 챗봇">
<meta name="robots" content="index, follow">
<meta name="google-site-verification" content="uMlBe2tjl3cK0eXkD4dlkfMasM03WFBZX0m20YETotQ">

<title>범-GPT | AI 채팅 서비스</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:sans-serif;
height:100dvh;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#0a0a0a;
border-bottom:1px solid #222;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
}

.reset-btn{
background:#111;
color:white;
border:1px solid #333;
padding:10px 14px;
border-radius:10px;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px;
}

.message{
max-width:80%;
padding:14px;
margin:10px 0;
border-radius:14px;
word-wrap:break-word;
white-space:pre-wrap;
}

.user{
background:#1e1e1e;
margin-left:auto;
}

.ai{
background:#111;
border:1px solid #333;
}

.bottom{
padding:15px;
border-top:1px solid #222;
background:#0a0a0a;
flex-shrink:0;
}

.input-area{
display:flex;
align-items:center;
gap:10px;
}

.attach-btn{
width:50px;
height:50px;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:22px;
flex-shrink:0;
}

#input{
flex:1;
height:50px;
background:#111;
border:none;
border-radius:12px;
color:white;
padding:0 15px;
outline:none;
font-size:16px;
min-width:0;
}

.send-btn{
width:70px;
height:50px;
border:none;
border-radius:12px;
font-weight:bold;
flex-shrink:0;
}

#fileInput{
display:none;
}

/* 모바일 */

@media(max-width:768px){

.topbar{
padding:0 10px;
height:55px;
}

.logo{
font-size:18px;
}

.reset-btn{
padding:8px 10px;
font-size:12px;
}

#chat{
padding:10px;
}

.message{
max-width:100%;
padding:12px;
font-size:14px;
}

.bottom{
padding:10px;
}

.input-area{
gap:6px;
}

.attach-btn{
width:45px;
height:45px;
font-size:18px;
}

#input{
height:45px;
font-size:16px;
}

.send-btn{
width:55px;
height:45px;
font-size:13px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
🤖 범-GPT
</div>

<button
class="reset-btn"
onclick="resetChat()">
리셋
</button>

</div>

<div id="chat"></div>

<div class="bottom">

<div class="input-area">

<button
class="attach-btn"
onclick="openFile()">
+
</button>

<input
type="file"
id="fileInput"
accept="image/*,video/*,.pdf"
onchange="handleFile(event)"
>

<input
id="input"
placeholder="범-GPT에게 메시지 보내기..."
>

<button
class="send-btn"
onclick="sendMessage()">
전송
</button>

</div>

</div>

<script>

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

let selectedFile = null;

window.onload=()=>{

const saved=
localStorage.getItem("chat");

if(saved){

chat.innerHTML=saved;

scrollBottom();

}

};

function openFile(){

document
.getElementById(
"fileInput"
)
.click();

}

function handleFile(e){

selectedFile=
e.target.files[0];

}

function sendMessage(){

const text=
input.value.trim();

if(text==""&&!selectedFile)
return;

chat.innerHTML+=`

<div class="message user">
${text}
</div>

`;

chat.innerHTML+=`

<div class="message ai" id="loading">

범-GPT 응답 기다리는중...

</div>

`;

scrollBottom();

input.value="";

fetch(
"https://beom-gpt.onrender.com/chat",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:text

})

})

.then(
res=>res.json()
)

.then(data=>{

const loading=
document.getElementById(
"loading"
);

if(loading){

loading.remove();

}

chat.innerHTML+=`

<div class="message ai">

${data.reply}

</div>

`;

saveChat();

scrollBottom();

})

.catch(()=>{

const loading=
document.getElementById(
"loading"
);

if(loading){

loading.remove();

}

chat.innerHTML+=`

<div class="message ai">

오류 발생 😥

</div>

`;

});

}

function saveChat(){

localStorage.setItem(
"chat",
chat.innerHTML
);

}

function resetChat(){

if(confirm("채팅 삭제?")){

chat.innerHTML="";

localStorage.removeItem(
"chat"
);

}

}

function scrollBottom(){

chat.scrollTop=
chat.scrollHeight;

}

input.addEventListener(
"keypress",
e=>{

if(e.key=="Enter"){

sendMessage();

}

});

</script>

</body>
</html>
